# Builds and tests Windows, Linux and macOS on every push and PR.
#
# Every release ships exactly one file per OS, and that file both installs and updates:
#   IPTrail-setup.exe       Windows x64 (Inno Setup; asks for the folder once, updates reuse it)
#   IPTrail-linux-x64       Linux x64 (installs itself into a folder you pick)
#   IPTrail-macos-arm64     macOS Apple Silicon (installs itself as an .app into a folder you pick)
# plus SHA256SUMS.txt, which installed copies verify their updates against.
# These names are API: installed copies look for them (src/install/update.rs).
#
# Releasing is automatic: bump `version` in Cargo.toml, add its CHANGELOG.md section and push to
# main. When no release with that version exists yet, the `release` job tags the commit (e.g.
# `v3.1.0`) and publishes the release. Pushing a matching `vX.Y.Z` tag by hand works too.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v$version already exists, nothing to publish."
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "### IPTrail $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Format & Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: cargo build --locked --release
      - name: Setup (install + update in one file)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ needs.meta.outputs.version }}" "/DSourceDir=$PWD\target\release" installer\iptrail.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\IPTrail-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: IPTrail-setup.exe
          path: IPTrail-setup.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: meta
    # Oldest supported runner = widest glibc compatibility for the binary.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: |
          cargo build --locked --release --bin iptrail
          cp target/release/iptrail IPTrail-linux-x64
          chmod +x IPTrail-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: IPTrail-linux-x64
          path: IPTrail-linux-x64
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked --release
      - name: Build
        run: |
          cargo build --locked --release --bin iptrail --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/iptrail IPTrail-macos-arm64
          chmod +x IPTrail-macos-arm64
          codesign --force -s - IPTrail-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: IPTrail-macos-arm64
          path: IPTrail-macos-arm64
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, lint, windows, linux, macos]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          chmod +x IPTrail-linux-x64 IPTrail-macos-arm64
          sha256sum IPTrail-setup.exe IPTrail-linux-x64 IPTrail-macos-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "## IPTrail $VERSION"
            echo
            echo "_Made by **Akulav**: no spyware, no telemetry, no API keys._"
            echo
            awk -v v="$VERSION" 'index($0, "## [" v "]")==1 {f=1; next} /^## \[/ {f=0} f' ../CHANGELOG.md
            echo
            echo "One file per system. The same file installs the app and later updates it."
            echo
            echo "| System | Download | First start |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11 (x64) | [IPTrail-setup.exe]($BASE/IPTrail-setup.exe) | Asks where to install (no admin rights). Updates reuse that folder. |"
            echo "| Linux x64 | [IPTrail-linux-x64]($BASE/IPTrail-linux-x64) | \`chmod +x\` it and run it. It asks where to install. |"
            echo "| macOS Apple Silicon | [IPTrail-macos-arm64]($BASE/IPTrail-macos-arm64) | \`chmod +x\`, then right-click → Open. It asks where to install. |"
            echo
            echo "The app and everything it saves (settings, IP history, change log) live in the folder you choose."
            echo "Installed copies update themselves in one click, verified with SHA-256."
            echo
            echo "<details><summary>SHA-256 checksums</summary>"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo "</details>"
            echo
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: IPTrail v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          make_latest: true
          files: |
            dist/IPTrail-setup.exe
            dist/IPTrail-linux-x64
            dist/IPTrail-macos-arm64
            dist/SHA256SUMS.txt
