name: Release

# A release is published automatically whenever `main` carries a version in
# Cargo.toml that has no matching `vX.Y.Z` tag yet. Pushing a `vX.Y.Z` tag by
# hand works too, as long as it matches Cargo.toml.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
              exit 1
            fi
            release=true
          elif git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::${tag} already exists — nothing to release. Bump the version in Cargo.toml to publish."
            release=false
          else
            release=true
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "Version ${version}, tag ${tag}, release=${release}"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
          - name: Linux x86_64
            # Oldest supported runner = widest glibc compatibility for the binary.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libfontconfig1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "iptrail-$env:VERSION-${{ matrix.slug }}"
          New-Item -ItemType Directory -Force dist, "stage/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/iptrail.exe" "stage/$name/IPTrail.exe"
          Copy-Item "target/${{ matrix.target }}/release/iptrail-cli.exe" "stage/$name/iptrail-cli.exe"
          Copy-Item README.md, LICENSE, CHANGELOG.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          Copy-Item "target/${{ matrix.target }}/release/iptrail.exe" "dist/IPTrail-$env:VERSION-portable.exe"

      - name: Package (Linux tarball)
        if: runner.os == 'Linux'
        run: |
          name="iptrail-${VERSION}-${{ matrix.slug }}"
          mkdir -p dist "stage/${name}"
          cp "target/${{ matrix.target }}/release/iptrail" "stage/${name}/"
          cp README.md LICENSE CHANGELOG.md packaging/linux/iptrail.desktop "stage/${name}/"
          cp assets/icon-256.png "stage/${name}/iptrail.png"
          tar -C stage -czf "dist/${name}.tar.gz" "${name}"

      - name: Package (Debian)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          # cargo-deb reads assets from target/release
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/iptrail" target/release/iptrail
          cargo deb --no-build --no-strip --output "dist/iptrail_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v ver="${VERSION}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release ${TAG}" > notes.md; fi
          {
            echo
            echo "### Downloads"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Windows 10/11 (x64) | \`iptrail-${VERSION}-windows-x86_64.zip\` (app + \`iptrail-cli.exe\` for terminals) or the portable \`IPTrail-${VERSION}-portable.exe\` |"
            echo "| Debian / Ubuntu (x64) | \`iptrail_${VERSION}_amd64.deb\` |"
            echo "| Other Linux (x64) | \`iptrail-${VERSION}-linux-x86_64.tar.gz\` |"
            echo
            echo "Verify downloads with \`SHA256SUMS.txt\`."
          } >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: IPTrail ${{ env.TAG }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
